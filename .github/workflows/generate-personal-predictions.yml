name: Generate Personal Daily JoAI Predictions

on:
  schedule:
    # Run every day at 01:15 UTC (after global predictions, to avoid load overlap)
    - cron: '15 1 * * *'
  workflow_dispatch:  # Allows manual run from GitHub UI

jobs:
  generate-personal-predictions:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary torch python-dotenv

      - name: Run personal daily predictions generator
        run: |
          python generate_personal_daily_predictions.py

      - name: Commit log update (optional)
        if: success()
        run: |
          git config --global user.name "JoAI Bot"
          git config --global user.email "joai@rpchost.com"
          git add personal_predictions.log || echo "No log to add"
          git diff --quiet && echo "No changes" || (git commit -m "Update personal predictions log - $(date -u +'%Y-%m-%d')" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}