name: Daily Predictions and Signals [every day]

on:
  schedule:
    # Run every day at 00:15 UTC (shortly after midnight)
    - cron: '15 0 * * *'
  workflow_dispatch:  # Allows you to run it manually from GitHub UI

jobs:
  generate-predictions:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the commit-log step pushes to the repo
      issues: write     # the failure alert opens or comments on an issue
    env:
      JOAI_BASE_URL: ${{ secrets.JOAI_BASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Shared secret required by JoAI's /joai and /predict-by-user endpoints.
      JOAI_ADMIN_API_KEY: ${{ secrets.JOAI_ADMIN_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --no-cache-dir

      # Proves the secret reached the job without printing it. A 401 from JoAI
      # means this fingerprint does not match JoAI's JOAI_ADMIN_API_KEY.
      - name: Verify JoAI admin secret
        run: |
          KEY=$(printf '%s' "$JOAI_ADMIN_API_KEY" | tr -d '[:space:]')
          if [ -z "$KEY" ]; then
            echo "::error::JOAI_ADMIN_API_KEY is empty - add it under Settings > Secrets and variables > Actions > Repository secrets"
          else
            echo "key length: ${#KEY}"
            echo "key sha256: $(printf '%s' "$KEY" | sha256sum | cut -c1-16)"
          fi

      # 0. Refresh candles first: without the just-closed daily candle the model
      #    sees a window that ends two days back and repeats yesterday's output.
      - name: Fetch fresh OHLC
        run: python fetch_data.py

       # 1. Generate predictions for TOMORROW
      - name: Generate Global Predictions
        run: python generate_daily_predictions.py
      
      - name: Generate Personal Predictions
        run: python generate_personal_daily_predictions.py
      
      # 2. Generate signals from TOMORROW's predictions (unresolved)
      - name: Generate Signals
        run: python generate_signals.py

      # Close any signal whose target, stop or deadline has been reached.
      - name: Resolve Open Signals
        run: python resolve_signals.py
      
      # 3. Resolve YESTERDAY's predictions (and their signals)
      - name: Resolve Global Predictions
        run: python resolve_daily_predictions.py
      
      - name: Resolve Personal Predictions
        run: python resolve_personal_daily_predictions.py

      # 4. Retrain personal adapters on today's resolved data. This used to be a
      #    Render cron (joai-adapter-retrainer-daily); all scheduling now lives in
      #    GitHub Actions so Render runs no cron jobs. Training executes inside the
      #    JoAI web service, which owns the model checkpoints and the DB.
      - name: Retrain Personal Adapters
        if: success()
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$JOAI_ADMIN_API_KEY" | tr -d '[:space:]')
          # Strip spaces and EVERY trailing slash: the endpoint answers only on
          # /admin/retrain-adapters - a trailing slash returns HTTP 307.
          BASE=$(printf '%s' "$JOAI_BASE_URL" | tr -d '[:space:]' | sed 's:/*$::')
          URL="$BASE/admin/retrain-adapters"
          echo "POST $URL"

          # --location keeps POST across a 307/308 canonical redirect, and -D
          # dumps the headers so a redirect is visible in the log instead of
          # only showing up as an unexplained status code.
          code=$(curl -sS --location -D /tmp/retrain_start.headers             -o /tmp/retrain_start.json -w '%{http_code}'             -X POST -H "X-API-Key: $KEY" -H 'Content-Type: application/json'             "$URL")
          grep -iE '^(HTTP/|location:)' /tmp/retrain_start.headers || true
          cat /tmp/retrain_start.json; echo

          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo "::error::$URL returned HTTP $code"
            exit 1
          fi
          # A redirect onto an HTML page also returns 200, so insist on a JSON
          # body that actually accepted the job.
          python3 -c "import json,sys; d=json.load(open('/tmp/retrain_start.json')); sys.exit(0 if isinstance(d,dict) and (d.get('success') or d.get('running')) else 1)"             || { echo "::error::$URL did not accept the retrain (unexpected body)"; exit 1; }
          echo "Retrain accepted"

          # Poll until the background training thread reports completion.
          for i in $(seq 1 40); do
            sleep 30
            curl -sS --location -H "X-API-Key: $KEY" "$BASE/admin/retrain-adapters/status" -o /tmp/retrain_status.json
            cat /tmp/retrain_status.json; echo
            running=$(python3 -c "import json;print(str(json.load(open('/tmp/retrain_status.json')).get('running')).lower())")
            err=$(python3 -c "import json;print(json.load(open('/tmp/retrain_status.json')).get('error') or '')")
            if [ -n "$err" ]; then
              echo "::error::Adapter retrain failed: $err"
              exit 1
            fi
            if [ "$running" = "false" ]; then
              echo "Adapter retrain finished"
              break
            fi
            if [ "$i" = "40" ]; then
              echo "::error::Adapter retrain still running after 20 minutes"
              exit 1
            fi
          done

      - name: Commit log update (optional - if you want to track logs in repo)
        if: success()
        run: |
          git config --global user.name "JoAI Bot"
          git config --global user.email "joai@rpchost.com"
          git add predictions.log || echo "No log file to add"
          git diff --quiet && echo "No changes to commit" || (git commit -m "Update daily predictions log - $(date -u +'%Y-%m-%d')" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tell the owner instead of nobody noticing a silent stop.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="Workflow failing: ${{ github.workflow }}"
          BODY="Run #${{ github.run_number }} failed on ${{ github.sha }} (${{ github.event_name }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUMBER=$(gh issue list --state open --limit 100 --json number,title | python3 -c "import json,sys; t=sys.argv[1]; print(next((i['number'] for i in json.load(sys.stdin) if i['title']==t), ''))" "$TITLE" || true)
          if [ -n "${NUMBER:-}" ]; then
            echo "Commenting on tracking issue #$NUMBER"
            gh issue comment "$NUMBER" --body "$BODY" || echo "::warning::Could not comment on issue #$NUMBER - see the run log"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "::warning::Could not open an issue (are Issues enabled?) - see the run log"
          fi
