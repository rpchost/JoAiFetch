name: Hourly OHLC fetch predictions signals [every hour]

on:
  schedule:
    # Run every day at 00:15 UTC (shortly after midnight)
    - cron: '10 * * * *'
  workflow_dispatch:  # Allows you to run it manually from GitHub UI

jobs:
  generate-predictions:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the commit-log step pushes to the repo
      issues: write     # the failure alert opens or comments on an issue
    env:
      JOAI_BASE_URL: ${{ secrets.JOAI_BASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Shared secret required by JoAI's /joai and /predict-by-user endpoints.
      JOAI_ADMIN_API_KEY: ${{ secrets.JOAI_ADMIN_API_KEY }}
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --no-cache-dir

      # Proves the secret reached the job without printing it. A 401 from JoAI
      # means this fingerprint does not match JoAI's JOAI_ADMIN_API_KEY.
      - name: Verify JoAI admin secret
        run: |
          KEY=$(printf '%s' "$JOAI_ADMIN_API_KEY" | tr -d '[:space:]')
          if [ -z "$KEY" ]; then
            echo "::error::JOAI_ADMIN_API_KEY is empty - add it under Settings > Secrets and variables > Actions > Repository secrets"
          else
            echo "key length: ${#KEY}"
            echo "key sha256: $(printf '%s' "$KEY" | sha256sum | cut -c1-16)"
          fi
      
       # 0. Generate predictions for TOMORROW
      - name: Fetch OLHC data
        run: python fetch_data.py    

       # 1. Generate predictions for TOMORROW
      - name: Generate Global Predictions HOURLY
        run: python generate_daily_predictions.py hourly
      
      - name: Generate Personal Predictions HOURLY
        run: python generate_personal_daily_predictions.py hourly
      
      # 2. Generate signals from TOMORROW's predictions (unresolved)
      - name: Generate Signals
        run: python generate_signals.py

      # Close any signal whose target, stop or deadline has been reached.
      - name: Resolve Open Signals
        run: python resolve_signals.py
      
      - name: Commit log update (optional - if you want to track logs in repo)
        if: success()
        run: |
          git config --global user.name "JoAI Bot"
          git config --global user.email "joai@rpchost.com"
          git add predictions.log || echo "No log file to add"
          git diff --quiet && echo "No changes to commit" || (git commit -m "Update daily predictions log - $(date -u +'%Y-%m-%d')" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tell the owner instead of nobody noticing a silent stop.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="Workflow failing: ${{ github.workflow }}"
          BODY="Run #${{ github.run_number }} failed on ${{ github.sha }} (${{ github.event_name }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUMBER=$(gh issue list --state open --limit 100 --json number,title | python3 -c "import json,sys; t=sys.argv[1]; print(next((i['number'] for i in json.load(sys.stdin) if i['title']==t), ''))" "$TITLE" || true)
          if [ -n "${NUMBER:-}" ]; then
            echo "Commenting on tracking issue #$NUMBER"
            gh issue comment "$NUMBER" --body "$BODY" || echo "::warning::Could not comment on issue #$NUMBER - see the run log"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "::warning::Could not open an issue (are Issues enabled?) - see the run log"
          fi
