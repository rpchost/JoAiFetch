name: Generate Daily JoAI Predictions

on:
  schedule:
    # Run every day at 00:15 UTC (shortly after midnight)
    - cron: '15 0 * * *'
  workflow_dispatch:  # Allows you to run it manually from GitHub UI

jobs:
  generate-predictions:
    runs-on: ubuntu-latest
    env:
      JOAI_BASE_URL: ${{ secrets.JOAI_BASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests python-dotenv

      - name: Run daily predictions generator
        run: |
          python generate_daily_predictions.py

      - name: Commit log update (optional - if you want to track logs in repo)
        if: success()
        run: |
          git config --global user.name "JoAI Bot"
          git config --global user.email "joai@rpchost.com"
          git add predictions.log || echo "No log file to add"
          git diff --quiet && echo "No changes to commit" || (git commit -m "Update daily predictions log - $(date -u +'%Y-%m-%d')" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}