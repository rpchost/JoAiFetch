name: Resolve Daily Predictions

on:
  schedule:
    - cron: '30 0 * * *'  # Every day at 00:30 UTC (after candle closes)
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg2-binary python-dotenv
      - name: Resolve predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python resolve_daily_predictions.py