name: Resolve Personal Daily Predictions

on:
  schedule:
    # Run every day at 00:45 UTC (after global resolver, once daily candles are confirmed)
    - cron: '45 0 * * *'
  workflow_dispatch:

jobs:
  resolve-personal:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Resolve personal predictions
        run: |
          python resolve_personal_daily_predictions.py